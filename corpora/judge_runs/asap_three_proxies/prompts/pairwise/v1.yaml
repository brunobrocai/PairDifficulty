# ASAP 2.0 FACS — pairwise v1 (self-contained: block refs flattened
# in-line so this dir carries no cross-file prompt deps, like clear/).
# Pick the higher-quality essay of two (A/B, no ties).

sysprompt: You are an expert essay grader comparing the overall (holistic) quality of two source-based, argumentative student essays written in response to the same writing prompt. Pick the higher-quality essay using the criteria below.
userprompt: |-
  You are judging the overall (holistic) quality of a source-based, argumentative essay written by a school student in response to the writing prompt shown below. Quality is holistic: weigh everything that goes into a strong essay together, not any single feature in isolation.

  What contributes to holistic quality:
  - whether the essay develops a clear, well-supported point of view on the issue, with genuine critical thinking (vs. a vague, simplistic, or missing position)
  - whether it uses appropriate, accurate examples, reasons, and evidence drawn from the source text(s) (vs. sparse, misused, or merely personal-opinion support)
  - whether it is well organized and focused, with coherence and smooth progression of ideas (vs. disjointed or unfocused)
  - command of language: varied, accurate, apt vocabulary and meaningful sentence variety (vs. weak word choice or monotonous/broken structure)
  - control of grammar, usage, and mechanics (vs. errors frequent or serious enough to obscure meaning)

  ---

  The students first read the source article below, then wrote their essay in response to the writing prompt that follows. Use it to judge whether the essay's evidence is accurate and genuinely drawn from the source (vs. vague, misremembered, or fabricated).

  Source article — "Making Mona Lisa Smile" by Nick D'Alto:

  Imagine being able to detect exactly how other people are feeling, even when they are trying to hide their emotions. New software has been developed that improves accuracy in perceiving the emotions of others. This new software, the Facial Action Coding System, has promising applications for a variety of industries.

  She's 83 percent happy, 9 percent disgusted, 6 percent fearful, and 2 percent angry. No, that's not your science teacher, grading your latest lab assignment. It's the subject of Leonardo da Vinci's Renaissance painting, Mona Lisa—at least according to some new computer software that can recognize emotions. The software is the latest innovation from Prof. Thomas Huang, of the Beckman Institute for Advanced Science at the University of Illinois, working in collaboration with Prof. Nicu Sebe of the University of Amsterdam. Dr. Huang and his colleague are experts at developing better ways for humans and computers to communicate.

  Hold on! Can we actually "calculate" emotions—like math homework? And how can a computer recognize the subtle facial movements we humans use to express how we feel?

  The process begins when the computer constructs a 3-D computer model of the face; all 44 major muscles in the model must move like human muscles. Movement of one or more muscles is called an "action unit." Then Dr. Huang relies on the work of psychologists, such as Dr. Paul Eckman, creator of FACS (Facial Action Coding System). Eckman has classified six basic emotions—happiness, surprise, anger, disgust, fear, and sadness—and then associated each with characteristic movements of the facial muscles. For example, your frontalis pars lateralis muscle (above your eyes) raises your eyebrows when you're surprised; your orbicularis oris (around your mouth) tightens your lips to show anger.

  "The facial expressions for each emotion are universal," observes Dr. Huang, "even though individuals often show varying degrees of expression" (like not smiling as broadly). Using video imagery, the new emotion-recognition software tracks these facial movements—in a real face or in the painted face of Mona Lisa. By weighting the different units, the software can even identify mixed emotions (as in da Vinci's masterpiece). Each expression is compared against a neutral face (showing no emotion).

  In fact, we humans perform this same impressive "calculation" every day. For instance, you can probably tell how a friend is feeling simply by the look on her face. Of course, most of us would have trouble actually describing each facial trait that conveys happy, worried, etc. Yet Dr. Huang observes that artists such as da Vinci studied human anatomy to help them paint facial muscles precisely enough to convey specific emotions. His new computer software stores similar anatomical information as electronic code. Perhaps Dr. Huang's emotion algorithms are a different sort of "Da Vinci Code"!

  The Mona Lisa demonstration is really intended to bring a smile to your face, while it shows just how much this computer can do. Imagine a computer that knows when you're happy or sad. For example, if you smile when a Web ad appears on your screen, a similar ad might follow. But if you frown, the next ad will be different. "A classroom computer could recognize when a student is becoming confused or bored," Dr. Huang predicts. "Then it could modify the lesson, like an effective human instructor." The same technology can make computer-animated faces more expressive—for video games or video surgery. "Most human communication is nonverbal, including emotional communication," notes Dr. Huang. "So computers need to understand that, too."

  Your home PC can't handle the complex algorithms used to decode Mona Lisa's smile. But we can write down some simple instructions that "encode" different emotions.

  While looking in the mirror:
  1. Raise your lips at the corners of your mouth.
  2. Then squint your eyes slightly, to produce wrinkling ("crow's-feet") at the corners of your eyes.
  3. Holding that, raise the outer parts of your cheeks up, toward your eyes.

  Does your expression in the mirror suggest an emotion? Can your lab partner recognize which one? In fact, these are the instructions for a face that looks happy. It's all about those muscular action units. They even indicate the difference between a genuine smile and a forced one. In the real smile, the zygomatic major (muscles that begin at your cheek bones) lift the corners of your mouth. (That's our instruction #1.)

  Meanwhile, muscles called orbicularis oculi pars palpabraeus make crow's-feet around your eyes. (That's instruction #2.) But in a false smile, the mouth is stretched sideways using the zygomatic major and a different muscle, the risorius. To an expert, faces don't lie: these muscle clues are sometimes used to spot when a "smiling" politician or celebrity isn't being truthful.

  By the way, did making a happy face in this experiment also make you feel slightly happy? According to the Facial Feedback Theory of Emotion, moving your facial muscles not only expresses emotions, but also may even help produce them. ("Putting on a happy face" actually works!) A renowned drama coach, Constantin Stanislavsky, had his actors carefully reproduce smiling and frowning as a way of creating these emotions on stage. Empathy (feeling someone else's emotional state) may happen because we unconsciously imitate another person's facial expressions. Whoever thought that making faces could reveal so much about the science of emotions!

  ---

  Writing prompt the students responded to:
  {assignment}

  ---

  Essay A:
  {text_a}

  ---

  Essay B:
  {text_b}

  ---

  Which essay is higher quality overall?

  Answer with a JSON object {"verdict": "A"} if Essay A is higher quality, or {"verdict": "B"} if Essay B is higher quality. You must pick one — no ties.
extra:
  schema:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - A
        - B
    required:
    - verdict
  schema_name: PairwiseVerdict
  response_field: verdict
