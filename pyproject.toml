[project]
name = "pair-difficulty-replication"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "choix>=0.4.1",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

# The default cache-only reproduction (simulation + the two tables) needs only
# the deps above. Regenerating the judge caches needs an OpenAI key for the
# API judges (gpt-5.4-*); the open-weight judges (Ministral-3, Gemma-3) re-run
# via these optional backends. See README.md.
[project.optional-dependencies]
local = [
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.24",
    "hf_transfer>=0.1.6",
]
cluster = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
    "outlines>=1.0",
]
